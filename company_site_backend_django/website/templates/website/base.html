{% load tailwind_tags static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ page_title }} - StayConnect{% endblock %}</title>

  {% tailwind_css %}

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icon-Font CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/lucide-static@latest/font/lucide.css"
  >

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .chat-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Navigation -->
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <!-- … -->
    <a href="{% url 'website:home' %}" class="flex items-center space-x-2">
      <i data-lucide="home" class="w-5 h-5 text-brand-pink"></i>
      <span class="text-xl font-bold text-brand-dark">StayConnect</span>
    </a>
    <!-- … -->
  </nav>

  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-brand-dark text-white mt-16">
    <!-- … -->
    <i class="icon-mail text-gray-300 w-6 h-6"></i> <!-- example usage -->
    <!-- … -->
  </footer>

  <!-- Chat Widget Container -->
  <div id="chat-widget" class="chat-widget"></div>

  <!-- Scripts -->
  <script>
    // Mobile menu toggle...
  </script>
</body>
</html>
